services:
  - type: web
    name: insurepredict-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://insure-predict.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://insure-predict.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: insurepredict
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 1440
      - key: COOKIE_SAMESITE
        value: none
